<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ascend-platform-stack.md</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #5c6b7a;
    --line: #e6ebf2;
    --link: var(--color-primary);
    --body-size: var(--text-body);
    --body-lh: 1.65;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    color: var(--text);
  }
  .md-embed {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: #fff;
    color: var(--muted);
    font-size: var(--text-body);
  }
  .md-embed .fb-banner {
    flex: 0 0 auto;
    padding: 10px 14px;
    background: #f4f7fb;
    border-bottom: 1px solid var(--line);
    font-size: var(--text-auxiliary);
    color: var(--muted);
  }
  .md-embed .fb-banner a {
    color: var(--link);
    font-weight: 600;
    text-decoration: none;
  }
  .md-embed .fb-banner a:hover { text-decoration: underline; }
  .md-embed .fb-body.md-source {
    flex: 1 1 auto;
    overflow: auto;
    padding: 16px 18px;
    margin: 0;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    font-size: var(--body-size);
    line-height: var(--body-lh);
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="md-embed">
    <div class="fb-banner">
      内嵌为建议稿参照（非线上实文件）：
      <a href="ascend-platform-stack.md">ascend-platform-stack.md</a>
    </div>
    <div class="fb-body md-source" id="md-mirror">加载中…</div>
  </div>
  <script>
  (function () {
    var el = document.getElementById("md-mirror");
    fetch("ascend-platform-stack.md")
      .then(function (res) {
        if (!res.ok) throw new Error(String(res.status));
        return res.text();
      })
      .then(function (text) {
        el.textContent = text;
      })
      .catch(function () {
        el.textContent = "无法加载建议稿。";
      });
  })();
  </script>
</body>
</html>
