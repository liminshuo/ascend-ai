<style>
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 56px; min-height: 56px; max-height: 56px;
    box-sizing: border-box;
    background: #fff;
    border-bottom: 1px solid var(--color-border);
    overflow: visible;
  }
  .topbar-inner {
    width: 100%; max-width: none; margin: 0; padding: 0 24px; box-sizing: border-box;
    height: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 0;
  }
  .topbar .brand {
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
    color: var(--color-text); text-decoration: none; white-space: nowrap; margin-right: 40px;
  }
  .topbar .brand span { color: var(--color-primary); }
  .topbar .site-nav { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; flex-wrap: wrap; }
  .topbar .site-nav > a {
    text-decoration: none; color: var(--color-text-secondary); font-size: var(--text-body); font-weight: 500;
    padding: 6px 14px; border-radius: 6px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .topbar .site-nav > a:hover { color: var(--color-primary); background: var(--color-bg); text-decoration: none; }
  .topbar .site-nav > a.active { color: var(--color-primary); background: var(--color-bg); font-weight: 600; }
  .nav-dd { position: relative; z-index: 210; display: inline-flex; align-items: center; }
  .nav-dd-trigger {
    appearance: none; border: 0; background: transparent; cursor: pointer; font: inherit;
    text-decoration: none; color: var(--color-text-secondary); font-size: var(--text-body); font-weight: 500;
    padding: 6px 14px; border-radius: 6px; white-space: nowrap;
    transition: background .15s, color .15s;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .nav-dd-trigger::after {
    content: ""; width: 6px; height: 6px;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg); opacity: .65; margin-top: -3px; flex-shrink: 0;
  }
  .nav-dd-trigger:hover, .nav-dd:hover .nav-dd-trigger, .nav-dd:focus-within .nav-dd-trigger {
    color: var(--color-primary); background: var(--color-bg);
  }
  .nav-dd::before { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; }
  .nav-dd-panel {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 148px; padding: 6px;
    background: #fff; border: 1px solid var(--color-border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(25, 25, 25, 0.08);
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity .15s, transform .15s, visibility .15s; z-index: 210;
  }
  .nav-dd:hover .nav-dd-panel, .nav-dd:focus-within .nav-dd-panel {
    opacity: 1; visibility: visible; transform: translateY(0);
  }
  .nav-dd-panel a {
    display: block; padding: 8px 12px; border-radius: 6px; text-decoration: none;
    color: var(--color-text-secondary); font-size: 13px; font-weight: 500; line-height: 1.4;
  }
  .nav-dd-panel a:hover { color: var(--color-primary); background: var(--color-bg); }

  .practice-block {
    margin: 0;
    padding: 0;
    border: none;
  }

    margin-top: var(--space-stack, 16px);

  body.inner-page[data-page="llms-parse"] .main-content .section > p.flow-verify {
    margin: var(--space-stack, 16px) 0 0;
    font-size: var(--text-body);
    line-height: 22px;
  }

  }

    text-decoration: underline;

  body.inner-page[data-page="llms-parse"] .main-content > .section:first-of-type > h2 {
    margin-top: 0;
  }
  .bg-body {
    margin: 0;
    font-size: var(--text-body);
    line-height: 22px;
    color: var(--color-text, var(--color-text));
  }
  .bg-body:last-child { margin-bottom: 0; }
  .bg-list {
    margin: 0;
    padding-left: 1.25em;
    font-size: var(--text-body);

  .bg-list li + li { margin-top: 6px; }

    padding: 0;

    display: block;

  .aj {
    width: 100%;
    min-width: 880px;
    border-collapse: separate;

  }
  .aj caption {

  .aj .aj-col-mute { width: 76px; }
  .aj td.is-mute {

  .aj th,
  .aj td {
    border: 1px solid #e8eef5;

  .fn-ex-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: stretch;
    margin: 16px 0 0;
  }
  .fn-ex-row .fn-ex {
    display: grid;
    grid-template-rows: subgrid;
    grid-row: 1 / span 3;
    margin: 0;
    min-width: 0;
  }
  .fn-ex-row .fn-ex-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 16px;
  }
  .fn-ex-row .fn-ex-head .fn-ex-label { margin: 0; }

    display: block; margin: 0; width: 100%; align-self: stretch;
  }
  .fn-ex-row .fn-ex-body {
    display: grid;
    grid-template-rows: subgrid;
    grid-row: 2 / span 2;
    min-height: 0;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .fn-ex-row .fn-ex-mock {

    border: none; border-radius: 0; align-self: stretch;
  }

  .fn-ex-row .fn-ex-foot {

  .fn-ex-label {

  }
  .fn-ex-list li {

  }
  .fn-ex-list strong { font-weight: 650; }
