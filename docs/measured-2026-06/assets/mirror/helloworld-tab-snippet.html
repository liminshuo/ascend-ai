<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloWorld Tab 片段（示意）</title>
  <style>
    body { margin: 0; padding: 20px 24px; font-family: "PingFang SC", sans-serif; font-size: 14px; line-height: 1.7; color: #1e293b; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .tab-nav { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-nav button { padding: 6px 12px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer; }
    .tab-nav button.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .tab-panel { display: none; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; }
    .tab-panel.active { display: block; }
    code, pre { background: #f1f5f9; padding: 8px 12px; border-radius: 4px; display: block; font-size: 13px; }
  </style>
</head>
<body>
  <h1>HelloWorld · 编译运行</h1>
  <div class="tab-nav">
    <button class="active" type="button">使用 bisheng</button>
    <button type="button">使用 CMake</button>
  </div>
  <div class="tab-panel active">
    <p><strong>使用 bisheng 命令行进行编译</strong></p>
    <pre>bisheng hello_world.asc --npu-arch=dav-2201 -o demo</pre>
  </div>
  <div class="tab-panel">
    <p><strong>使用 CMake 进行编译</strong></p>
    <pre>cmake_minimum_required(VERSION 3.16)
project(hello_world)
add_executable(demo hello_world.asc)</pre>
  </div>
  <p><em>（示意：全站 Tab 组件中非激活面板 <code>display:none</code> 的风险形态；HelloWorld 实页为列表并列展示，非此 UI。）</em></p>
</body>
</html>
