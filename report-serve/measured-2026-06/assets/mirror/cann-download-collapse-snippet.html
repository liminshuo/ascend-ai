<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANN 软件下载 · 折叠片段（示意）</title>
  <style>
    body { margin: 0; padding: 20px 24px; font-family: "PingFang SC", sans-serif; font-size: 14px; line-height: 1.7; color: #1e293b; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .page-note { color: #64748b; font-size: 13px; margin-bottom: 16px; }
    .collapse { border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 12px; }
    .collapse-header { padding: 10px 14px; background: #f8fafc; font-weight: 600; cursor: pointer; }
    .collapse-body { display: none; padding: 12px 14px; border-top: 1px solid #e2e8f0; }
    .collapse-body ul { margin: 8px 0 0; padding-left: 20px; }
    .collapse-body li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>CANN 软件下载</h1>
  <p class="page-note">分析聚焦 · 「我不知道硬件信息」折叠面板</p>

  <p>请先选择产品型号与 CANN 版本，再下载对应软件包。</p>

  <div class="collapse">
    <div class="collapse-header">▸ 我不知道硬件信息（默认折叠）</div>
    <div class="collapse-body">
      <p>若不确定昇腾处理器型号，可按以下方式确认后再选型下载：</p>
      <ul>
        <li>登录设备执行 <code>npu-smi info</code>，查看 Chip Name / 产品型号</li>
        <li>对照昇腾社区「产品型号与 CANN 版本配套关系」文档</li>
        <li>Atlas 训练/推理系列产品需匹配对应 CANN 社区版与驱动版本</li>
      </ul>
    </div>
  </div>

  <p><em>（示意：区内硬件确认指引默认 <code>display:none</code>，默认抓取可能只入库标题「我不知道硬件信息」，丢失选型依据。）</em></p>
</body>
</html>
