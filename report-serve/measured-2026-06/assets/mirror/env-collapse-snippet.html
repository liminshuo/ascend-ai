<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>折叠面板片段（示意）</title>
  <style>
    body { margin: 0; padding: 20px 24px; font-family: "PingFang SC", sans-serif; font-size: 14px; line-height: 1.7; color: #1e293b; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .collapse { border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 12px; }
    .collapse-header { padding: 10px 14px; background: #f8fafc; font-weight: 600; cursor: pointer; }
    .collapse-body { display: none; padding: 12px 14px; border-top: 1px solid #e2e8f0; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>环境准备 · 高级配置（示意）</h1>
  <div class="collapse">
    <div class="collapse-header">▸ 配置 CANN 环境变量（默认折叠）</div>
    <div class="collapse-body">
      <p>安装 CANN 软件后，执行 <code>source ${INSTALL_DIR}/set_env.sh</code> 设置环境变量。</p>
      <p>确认 <code>ASCEND_HOME_PATH</code> 已写入当前 shell。</p>
    </div>
  </div>
  <p><em>（示意：折叠区内步骤默认 <code>display:none</code>，用户展开可见，默认抓取可能截断。）</em></p>
</body>
</html>
